services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flourist
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d flourist']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: dev
    command: sh -c "bun run db:migrate && bun run start:dev"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/flourist
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@db:5432/flourist
      TEST_DATABASE_URL: postgresql://postgres:postgres@db:5432/flourist
      DATABASE_SSL: 'false'
      # Bind mounts from a Windows/macOS host do not deliver file events to the container.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    ports:
      - '8787:8787'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
